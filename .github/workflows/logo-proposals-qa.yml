name: Logo proposals visual QA
on:
  push:
    branches: [codex/selected-work-showcase]
    paths: [.github/workflows/logo-proposals-qa.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Render and inspect vector marks
        run: |
          mkdir -p .artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const name of ['fugue', 'madre', 'marge']) {
              const page = await browser.newPage({ viewport: { width: 1024, height: 1024 }, deviceScaleFactor: 1 });
              await page.goto('file://' + path.resolve('public/logos/proposals/' + name + '.svg'));
              const svg = page.locator('svg');
              if (await svg.count() !== 1) throw new Error('SVG missing: ' + name);
              const bounds = await svg.boundingBox();
              if (bounds.width !== 1024 || bounds.height !== 1024) throw new Error('Wrong logo dimensions: ' + JSON.stringify(bounds));
              await page.screenshot({ path: '.artifacts/' + name + '-proposal.jpg', quality: 90 });
              await page.close();
            }
            const board = await browser.newPage({ viewport: { width: 1560, height: 660 }, deviceScaleFactor: 1 });
            const fugue = 'data:image/svg+xml;base64,' + fs.readFileSync('public/logos/proposals/fugue.svg').toString('base64');
            const madre = 'data:image/svg+xml;base64,' + fs.readFileSync('public/logos/proposals/madre.svg').toString('base64');
            const marge = 'data:image/svg+xml;base64,' + fs.readFileSync('public/logos/proposals/marge.svg').toString('base64');
            await board.setContent('<html><body style="margin:0;background:#e9e4ea;display:flex;align-items:center;justify-content:center;gap:24px;height:660px"><img src="' + fugue + '" style="width:480px;height:480px;border-radius:24px;box-shadow:0 20px 50px #20182926"><img src="' + madre + '" style="width:480px;height:480px;border-radius:24px;box-shadow:0 20px 50px #20182926"><img src="' + marge + '" style="width:480px;height:480px;border-radius:24px;box-shadow:0 20px 50px #20182926"></body></html>');
            await board.locator('img').evaluateAll(images => Promise.all(images.map(img => img.decode())));
            await board.screenshot({ path: '.artifacts/logo-proposals-board.jpg', quality: 88 });
            console.log('Three SVG logos rendered at 1024x1024');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Save temporary previews
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .artifacts
          git commit -m "Temporary logo proposal previews"
          for attempt in 1 2 3 4 5; do
            git pull --rebase
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1
