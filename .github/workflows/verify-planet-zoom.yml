name: Verify final planet zoom
on:
  push:
    branches:
      - codex/selected-work-showcase
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Check the scroll zoom and WebGL handoff
        run: |
          npm run start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/work > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--enable-unsafe-swiftshader', '--disable-gpu-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, reducedMotion: 'no-preference' });
            await page.goto('http://127.0.0.1:3000/work', { waitUntil: 'networkidle' });
            const planet = page.locator('.work-planet');
            if (await planet.count() !== 1) throw new Error('Planet accent missing');
            const top = await page.locator('#systems').evaluate(el => el.getBoundingClientRect().top + window.scrollY);
            const scale = async () => planet.evaluate(el => {
              const transform = getComputedStyle(el).transform;
              return transform === 'none' ? 1 : new DOMMatrixReadOnly(transform).a;
            });
            await page.evaluate(y => window.scrollTo(0, y), top - 850);
            await page.waitForTimeout(800);
            const entering = await scale();
            await page.evaluate(y => window.scrollTo(0, y), top - 450);
            await page.waitForTimeout(800);
            const focused = await scale();
            const handoff = await page.locator('.work-planet .sculpture-canvas').evaluate(el => getComputedStyle(el).transitionProperty);
            if (!(entering < focused && focused > 0.99 && handoff.includes('transform') && handoff.includes('opacity'))) {
              throw new Error(JSON.stringify({ entering, focused, handoff }));
            }
            console.log(JSON.stringify({ entering, focused, handoff }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE