name: Selected Work final QA
on:
  push:
    branches: [codex/selected-work-showcase]
    paths: [.github/workflows/selected-work-final-qa.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start site
        run: |
          npm run start -- --port 3000 > /tmp/next.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/work >/dev/null && exit 0; sleep 2; done
          cat /tmp/next.log
          exit 1
      - name: Verify desktop and mobile interactions
        run: |
          mkdir -p .artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:3000/work', { waitUntil: 'networkidle' });
            const carousel = page.locator('#identities [aria-roledescription="carousel"]');
            await carousel.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1000);
            const count = await carousel.locator('button').count();
            if (count !== 8) throw new Error('Desktop carousel must show eight marks, got ' + count);
            const first = await carousel.locator('button img').first().getAttribute('alt');
            const shadow = await carousel.locator('.work-media').first().evaluate(el => getComputedStyle(el).boxShadow);
            if (shadow !== 'none') throw new Error('Carousel card shadow persists: ' + shadow);
            await page.screenshot({ path: '.artifacts/work-logos.jpg', quality: 75 });
            await page.waitForTimeout(4400);
            const next = await carousel.locator('button img').first().getAttribute('alt');
            if (next === first) throw new Error('Carousel did not advance in four seconds');
            await page.waitForTimeout(850);
            if (await carousel.locator('button').count() !== 8) throw new Error('Carousel should retain eight visible marks');
            const systems = page.locator('#systems');
            await systems.scrollIntoViewIfNeeded();
            await page.waitForTimeout(800);
            if (await systems.locator('button img').count() !== 3) throw new Error('Expected three admin captures');
            await page.screenshot({ path: '.artifacts/work-admin.jpg', quality: 75 });
            const atelier = page.locator('#websites article').nth(1);
            await atelier.scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);
            const clip = await atelier.locator('.work-media').last().locator('div').first().evaluate(el => getComputedStyle(el).clipPath);
            if (!clip.includes('inset')) throw new Error('Atelier detail image is not clipped: ' + clip);
            await page.screenshot({ path: '.artifacts/work-atelier.jpg', quality: 75 });
            const odyssea = page.locator('#websites article').first();
            const link = odyssea.locator('a[href*="odysseavision.com"]');
            if (await link.count() !== 1) throw new Error('Odyssea link missing');
            const positions = await odyssea.evaluate(el => {
              const anchor = el.querySelector('a[href*="odysseavision.com"]');
              const grid = el.querySelector('.lg\\:grid-cols-2');
              return { anchor: anchor?.getBoundingClientRect().top, gridBottom: grid?.getBoundingClientRect().bottom };
            });
            if (!(positions.anchor > positions.gridBottom)) throw new Error('Odyssea link is not below case detail');
            await link.hover();
            await page.waitForTimeout(550);
            const buttonColor = await link.locator('span').first().evaluate(el => getComputedStyle(el).backgroundImage);
            if (!buttonColor.includes('gradient')) throw new Error('External button violet fill missing');
            const figma = page.locator('#systems a[href*="node-id=3-2"]');
            if (await figma.count() !== 1) throw new Error('Figma link missing');
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:3000/work', { waitUntil: 'networkidle' });
            const mobileCarousel = mobile.locator('#identities [aria-roledescription="carousel"]');
            await mobileCarousel.scrollIntoViewIfNeeded();
            await mobile.waitForTimeout(750);
            const mobileCount = await mobileCarousel.locator('button').count();
            if (mobileCount !== 4) throw new Error('Mobile carousel must show four marks, got ' + mobileCount);
            const overflow = await mobile.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (overflow > 2) throw new Error('Mobile horizontal overflow: ' + overflow);
            await mobile.screenshot({ path: '.artifacts/work-logos-mobile.jpg', quality: 75 });
            console.log(JSON.stringify({ count, mobileCount, first, next, shadow, clip, positions, overflow, status: 'passed' }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Save temporary review captures
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .artifacts
          git commit -m "Temporary Selected Work final review captures"
          git pull --rebase
          git push
