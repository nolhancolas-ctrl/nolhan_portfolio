name: Selected Work detail QA
on:
  push:
    branches: [codex/selected-work-showcase]
    paths: [.github/workflows/selected-work-detail-qa.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start site
        run: |
          npm run start -- --port 3000 > /tmp/next.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/work >/dev/null && exit 0; sleep 2; done
          cat /tmp/next.log
          exit 1
      - name: Check Atelier frame and heading sculpture
        run: |
          mkdir -p .artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:3000/work', { waitUntil: 'networkidle' });
            const card = page.locator('#websites article').nth(1).locator('.work-media').last();
            await card.scrollIntoViewIfNeeded();
            await page.waitForTimeout(850);
            const frame = await card.evaluate(el => {
              const outer = el.getBoundingClientRect();
              const inner = el.firstElementChild.getBoundingClientRect();
              return { left: inner.left - outer.left, right: outer.right - inner.right, outerWidth: outer.width, innerWidth: inner.width, clip: getComputedStyle(el.firstElementChild).clipPath };
            });
            if (Math.abs(frame.left - frame.right) > 1.5) throw new Error('Atelier detail padding remains asymmetric: ' + JSON.stringify(frame));
            if (!(frame.left > 5 && frame.right > 5)) throw new Error('Atelier image touches frame border: ' + JSON.stringify(frame));
            await page.screenshot({ path: '.artifacts/atelier-frame.jpg', quality: 78 });
            const title = page.locator('#identities-title');
            const ornament = page.locator('#identities .work-mark-sculpture');
            await title.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1200);
            const positions = await page.evaluate(() => {
              const text = document.querySelector('#identities-title');
              const range = document.createRange();
              range.selectNodeContents(text);
              const heading = range.getBoundingClientRect();
              const sculpture = document.querySelector('#identities .work-mark-sculpture').getBoundingClientRect();
              return { headingLeft: heading.left, sculptureRight: sculpture.right, sculptureWidth: sculpture.width };
            });
            if (positions.sculptureWidth < 100 || positions.sculptureRight >= positions.headingLeft + 50) throw new Error('3D sculpture is not beside the heading: ' + JSON.stringify(positions));
            await page.screenshot({ path: '.artifacts/logos-sculpture.jpg', quality: 78 });
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:3000/work', { waitUntil: 'networkidle' });
            const overflow = await mobile.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (overflow > 2) throw new Error('Mobile horizontal overflow: ' + overflow);
            console.log(JSON.stringify({ frame, positions, overflow, status: 'passed' }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Save temporary review captures
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .artifacts
          git commit -m "Temporary Selected Work detail review captures"
          git pull --rebase
          git push
