name: Work crop and sculpture QA
on:
  push:
    branches: [codex/selected-work-showcase]
    paths: [.github/workflows/work-crop-sculpture-qa.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Check cropping and preload in Chromium
        run: |
          mkdir -p .artifacts
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/work-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/work > /dev/null; then break; fi
            sleep 2
          done
          node <<'NODE'
          const assert = require('assert');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--enable-unsafe-swiftshader', '--use-gl=angle', '--use-angle=swiftshader'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:3000/work', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => document.querySelectorAll('.work-mark-sculpture canvas, .work-planet canvas').length === 2, { timeout: 20000 });
            console.log('Both work sculptures created their canvases before scrolling');
            const atelier = page.locator('article').filter({ has: page.locator('#project-title-1') });
            const detail = atelier.locator('.work-media').last();
            const image = detail.locator('img');
            const fit = await image.evaluate(node => getComputedStyle(node).objectFit);
            assert.equal(fit, 'cover');
            await detail.screenshot({ path: '.artifacts/atelier-crop-qa.jpg', quality: 86 });
            await page.locator('#identities').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1200);
            const knot = await page.locator('.work-mark-sculpture').boundingBox();
            const title = await page.locator('#identities-title').boundingBox();
            assert(knot && title);
            assert(knot.x + knot.width <= title.x + 1, 'Knot should sit left of the title');
            assert(knot.width <= 120, 'Knot should stay compact');
            await page.locator('#identities').screenshot({ path: '.artifacts/knot-position-qa.jpg', quality: 86 });
            console.log('Atelier detail crops to frame; compact knot sits beside title');
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:3000/work', { waitUntil: 'domcontentloaded' });
            await mobile.waitForTimeout(1500);
            const mobileCanvases = await mobile.locator('.work-mark-sculpture canvas, .work-planet canvas').count();
            assert.equal(mobileCanvases, 0, 'Hidden desktop sculptures should not initialize on mobile');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Save temporary QA screenshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .artifacts
          git commit -m "Temporary work visual QA screenshots"
          for attempt in 1 2 3 4 5; do
            git pull --rebase
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1
