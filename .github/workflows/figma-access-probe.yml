name: Temporary Figma access probe
on:
  push:
    branches:
      - codex/selected-work-showcase
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check shared Figma file
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          url = "https://www.figma.com/design/av868cwJW6iYtGsVm3y3UY/Odyssea-Vision-%E2%80%94-Website?node-id=0-1"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  body = response.read(2000000).decode("utf-8", "ignore")
                  title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
                  print("HTTP:", response.status, "bytes:", len(body), "title:", title.group(1).strip() if title else "none")
                  print("Login wall:", any(s in body.lower() for s in ["log in to figma", "sign in to figma"]))
                  print("Admin mention:", "admin" in body.lower())
          except Exception as exc:
              print("ACCESS_ERROR:", type(exc).__name__, str(exc)[:200])
          PY
