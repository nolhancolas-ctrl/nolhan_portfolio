name: Convert Selected Work review capture
on:
  push:
    branches: [codex/selected-work-showcase]
    paths: [.github/workflows/selected-work-visual-qa.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compress focus screenshot
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          sharp('.artifacts/work-focus.png').jpeg({ quality: 70, mozjpeg: true }).toFile('.artifacts/work-focus.jpg').catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Save compressed capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .artifacts/work-focus.jpg
          git commit -m "Temporary compressed focus review capture"
          git push
